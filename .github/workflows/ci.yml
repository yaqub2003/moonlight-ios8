name: iOS 8 build

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      crash_frames:
        description: 'Optional: symbolicate a crash report from this exact build. "<arch> <Moonlight image base> <frame address>...", e.g. "armv7 0xbe000 0x00179a0a 0x000c4550"'
        required: false
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build Moonlight for iOS 8 (armv7 + arm64)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang lld llvm cmake ninja-build make perl python3 zip \
            libssl-dev uuid-dev libxml2-dev zlib1g-dev libplist-dev pkg-config

      # Building ld64 (cctools-port + libtapi) takes a while, so cache it.
      # The key covers the pinned versions in ios8/versions.sh.
      - name: Restore toolchain and SDK
        id: toolchain-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ios8/build/toolchain
            ios8/build/sdks
          key: ios8-toolchain-${{ runner.os }}-${{ hashFiles('ios8/versions.sh') }}

      - name: Fetch iOS SDK
        run: ios8/build.sh sdk

      - name: Build toolchain (ld64)
        run: ios8/build.sh toolchain

      - name: Save toolchain and SDK
        if: steps.toolchain-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ios8/build/toolchain
            ios8/build/sdks
          key: ios8-toolchain-${{ runner.os }}-${{ hashFiles('ios8/versions.sh') }}

      - name: Build dependencies (Opus, OpenSSL)
        run: ios8/build.sh deps

      - name: Build Moonlight
        run: ios8/build.sh app

      - name: Symbolicate crash report
        if: github.event_name == 'workflow_dispatch' && inputs.crash_frames != ''
        env:
          CRASH_FRAMES: ${{ inputs.crash_frames }}
        # Word splitting of CRASH_FRAMES is intended; the script validates every argument
        run: ios8/tools/symbolicate.sh $CRASH_FRAMES

      - name: Package IPA
        run: ios8/build.sh ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v7
        with:
          name: Moonlight-iOS8
          path: ios8/build/Moonlight-iOS8.ipa
          if-no-files-found: error

      - name: Upload debug symbols
        uses: actions/upload-artifact@v7
        with:
          name: Moonlight-iOS8-dSYM
          path: ios8/build/dSYM
          if-no-files-found: warn
